name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows10-x64
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Preserve frozen source and asset bytes
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out raylib 6.0
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: raysan5/raylib
          ref: dbc56a87da87d973a9c5baa4e7438a9d20121d28
          path: build/ci/raylib
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Windows x64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install pkgconfiglite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'pkg-config installation failed' }
          $version = '20250305'
          $name = "llvm-mingw-$version-ucrt-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$name.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          "ARK_LLVM_ROOT=$(Join-Path $env:RUNNER_TEMP $name)" >> $env:GITHUB_ENV

      - name: Install pinned font subset tool
        shell: pwsh
        run: python -m pip install --disable-pip-version-check fonttools==4.59.0

      - name: Build and test desktop Release, then package
        shell: bash
        env:
          ARK_CI_TARGET: windows10-x64
          PYTHONUTF8: '1'
        run: python .github/ci/build.py

      - name: Upload Release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ark-village-windows10-x64
          path: build/ci/dist/*
          if-no-files-found: error
          retention-days: 7
          # The game archive is already compressed; do not recompress it in the transport ZIP.
          compression-level: 0

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-windows10-x64
          path: |
            build/ci/logs/
            build/*/Testing/Temporary/
            build/*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested Windows Release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ark-village-windows10-x64
          path: release

      - name: Publish and verify Release assets
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          revision_tag="sha-${GITHUB_SHA}"
          windows=ark-village-windows10-x64.zip
          sha256sum --check "$windows.sha256"

          # Resume an interrupted draft; never overwrite already published assets.
          if ! is_draft=$(gh release view "$revision_tag" --json isDraft --jq '.isDraft'); then
            {
              printf 'Windows 10+ x64 build from commit `%s`.\n\n' "$GITHUB_SHA"
              printf 'Download and extract `%s`, then run `ark_village.exe`.\n\n' "$windows"
              printf 'Assets, a CJK font, and licenses are bundled; raylib and the C++ runtime are statically linked.\n\n'
              printf 'Build and standard CTest results: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            } > release-notes.md
            gh release create "$revision_tag" --target "$GITHUB_SHA" --draft \
              --title "Ark-Village Windows x64 (${GITHUB_SHA:0:7})" \
              --notes-file release-notes.md
            is_draft=true
          fi
          if [[ "$is_draft" == true ]]; then
            gh release upload "$revision_tag" "$windows" "$windows.sha256" --clobber
          fi
          gh release download "$revision_tag" --dir verified \
            --pattern "$windows" --pattern "$windows.sha256"
          cmp "$windows" "verified/$windows"
          cmp "$windows.sha256" "verified/$windows.sha256"

          # Re-running an older commit must not replace the current Latest release.
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            gh release edit "$revision_tag" --draft=false --latest
          elif [[ "$is_draft" == true ]]; then
            gh release edit "$revision_tag" --draft=false --latest=false
          fi
          release_url=$(gh release view "$revision_tag" --json url --jq '.url')
          {
            printf '### GitHub Release\n\n'
            printf 'Download the verified Windows x64 ZIP and SHA-256: %s\n\n' "$release_url"
            printf 'Commit tag: `%s`\n\n' "$revision_tag"
            printf 'Extract the ZIP and run `ark_village.exe`.\n'
          } >> "$GITHUB_STEP_SUMMARY"
