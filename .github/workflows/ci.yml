name: Build and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows10-x64
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Preserve frozen source and asset bytes
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check out raylib 6.0
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: raysan5/raylib
          ref: dbc56a87da87d973a9c5baa4e7438a9d20121d28
          path: build/ci/raylib
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install Windows x64 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install pkgconfiglite --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'pkg-config installation failed' }
          $version = '20250305'
          $name = "llvm-mingw-$version-ucrt-x86_64"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$name.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          "ARK_LLVM_ROOT=$(Join-Path $env:RUNNER_TEMP $name)" >> $env:GITHUB_ENV

      - name: Install pinned font subset tool
        shell: pwsh
        run: python -m pip install --disable-pip-version-check fonttools==4.59.0

      - name: Build and test desktop Release, then package
        shell: bash
        env:
          ARK_CI_TARGET: windows10-x64
          PYTHONUTF8: '1'
        run: python .github/ci/build.py

      - name: Upload Release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ark-village-windows10-x64
          path: build/ci/dist/*
          if-no-files-found: error
          retention-days: 7
          # The game archive is already compressed; do not recompress it in the transport ZIP.
          compression-level: 0

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-windows10-x64
          path: |
            build/ci/logs/
            build/*/Testing/Temporary/
            build/*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish GitHub Packages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Download tested Windows Release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ark-village-windows10-x64
          path: release

      - name: Install ORAS
        uses: oras-project/setup-oras@8d34698a59f5ffe24821f0b48ab62a3de8b64b20 # v1.2.3
        with:
          version: '1.2.3'

      - name: Publish and verify the package
        working-directory: release
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ORAS media-type arguments are not paths for Git Bash to translate.
          MSYS_NO_PATHCONV: '1'
        run: |
          set -euo pipefail
          package="ghcr.io/${GITHUB_REPOSITORY,,}"
          revision_tag="sha-${GITHUB_SHA}"
          windows=ark-village-windows10-x64.zip
          sha256sum --check "$windows.sha256"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'oras logout ghcr.io' EXIT
          oras push "$package:$revision_tag" \
            --artifact-type application/vnd.ark-village.release.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.title=Ark-Village desktop Release" \
            --annotation "org.opencontainers.image.description=Windows 10+ x64 game archive with bundled CJK font and static raylib/runtime; download with ORAS." \
            "$windows:application/zip" "$windows.sha256:text/plain"
          oras pull "$package:$revision_tag" --output verified
          cmp "$windows" "verified/$windows"
          cmp "$windows.sha256" "verified/$windows.sha256"
          oras tag "$package:$revision_tag" latest
          {
            printf '### GitHub Packages\n\n'
            printf 'Published the tested Windows x64 archive to **%s:latest**.\n\n' "$package"
            printf 'Commit tag: `%s:%s`\n\n' "$package" "$revision_tag"
            printf 'Download the archive and checksum: `oras pull %s:latest`\n\n' "$package"
            printf 'The repository Packages panel lists the package. New GHCR packages are private by default; access is managed in Package settings.\n'
          } >> "$GITHUB_STEP_SUMMARY"
